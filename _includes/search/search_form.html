{% assign locale = include.locale | default: site.locale %}
<div class="search-content__inner-wrap">
  <form class="search-content__form" onsubmit="return false;" role="search">
    <label class="sr-only" for="search">
      {{ site.data.ui-text[locale].search_label_text | default: '블로그 검색' }}
    </label>
    <input
      type="search"
      id="search"
      class="search-input"
      tabindex="-1"
      autocomplete="off"
      placeholder="{{ site.data.ui-text[locale].search_placeholder_text | default: '검색어를 입력하세요' }}"
    >
    <button class="search-content__close" type="button" aria-label="검색 닫기">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </form>
  <p class="search-content__hint">검색어를 입력하면 제목과 내용에서 찾아드립니다.</p>
  <div id="results" class="results" aria-live="polite"></div>
</div>
