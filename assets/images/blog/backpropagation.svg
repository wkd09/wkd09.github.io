<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Backpropagation through a neural network</title>
  <desc id="desc">A forward pass and reverse gradient flow through input, hidden, and output layers.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="52" y="48" width="856" height="324" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="92" y="92" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Backpropagation</text>
  <text x="92" y="126" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Forward computes predictions; backward applies the chain rule to update weights.</text>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="230" y1="190" x2="430" y2="170"/>
    <line x1="230" y1="190" x2="430" y2="250"/>
    <line x1="230" y1="270" x2="430" y2="170"/>
    <line x1="230" y1="270" x2="430" y2="250"/>
    <line x1="430" y1="170" x2="640" y2="220"/>
    <line x1="430" y1="250" x2="640" y2="220"/>
  </g>
  <g fill="#3b82f6" stroke="#1d4ed8" stroke-width="3">
    <circle cx="230" cy="190" r="26"/>
    <circle cx="230" cy="270" r="26"/>
  </g>
  <g fill="#22c55e" stroke="#15803d" stroke-width="3">
    <circle cx="430" cy="170" r="26"/>
    <circle cx="430" cy="250" r="26"/>
  </g>
  <circle cx="640" cy="220" r="28" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">
    <text x="230" y="330">Input</text>
    <text x="430" y="330">Hidden</text>
    <text x="640" y="330">Output</text>
  </g>
  <path d="M180 142h520" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <path d="M700 300H180" stroke="#ef4444" stroke-width="4" fill="none" marker-end="url(#redArrow)"/>
  <text x="414" y="136" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2563eb">forward</text>
  <text x="396" y="294" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ef4444">gradients</text>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
