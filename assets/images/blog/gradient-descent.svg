<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Gradient descent curve</title>
  <desc id="desc">A loss curve with update steps moving toward a minimum.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="52" y="48" width="856" height="324" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="92" y="92" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Gradient Descent</text>
  <text x="92" y="126" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Follow the negative gradient to reduce loss step by step.</text>
  <line x1="138" y1="316" x2="828" y2="316" stroke="#94a3b8" stroke-width="3"/>
  <line x1="138" y1="316" x2="138" y2="156" stroke="#94a3b8" stroke-width="3"/>
  <path d="M160 176 C240 322, 330 350, 470 226 C580 128, 690 214, 800 298" fill="none" stroke="#2563eb" stroke-width="5"/>
  <g fill="#ef4444">
    <circle cx="210" cy="236" r="8"/>
    <circle cx="282" cy="300" r="8"/>
    <circle cx="358" cy="305" r="8"/>
    <circle cx="438" cy="245" r="8"/>
  </g>
  <g stroke="#ef4444" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M220 244l45 43"/>
    <path d="M292 303l48 4"/>
    <path d="M365 300l55-42"/>
  </g>
  <text x="456" y="268" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">local minimum risk</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
