<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">In-context learning prompt examples</title>
  <desc id="desc">Zero-shot, one-shot, and few-shot prompting patterns used in GPT-3.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="52" y="48" width="856" height="324" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="92" y="92" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">In-Context Learning</text>
  <text x="92" y="126" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">GPT-3 adapts from instructions and examples inside the prompt, without weight updates.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="92" y="176" width="230" height="126" rx="14" fill="#eef6ff" stroke="#8fb7df"/>
    <text x="116" y="212" font-size="20" font-weight="700" fill="#1f2937">Zero-shot</text>
    <text x="116" y="246" font-size="16" fill="#475569">Task instruction only</text>
    <text x="116" y="274" font-size="15" fill="#64748b">Question -> Answer</text>
    <rect x="365" y="176" width="230" height="126" rx="14" fill="#f0fdf4" stroke="#8bcaa1"/>
    <text x="389" y="212" font-size="20" font-weight="700" fill="#1f2937">One-shot</text>
    <text x="389" y="246" font-size="16" fill="#475569">One example first</text>
    <text x="389" y="274" font-size="15" fill="#64748b">Example + Question</text>
    <rect x="638" y="176" width="230" height="126" rx="14" fill="#fff7ed" stroke="#f0b37e"/>
    <text x="662" y="212" font-size="20" font-weight="700" fill="#1f2937">Few-shot</text>
    <text x="662" y="246" font-size="16" fill="#475569">Several examples</text>
    <text x="662" y="274" font-size="15" fill="#64748b">Pattern + Question</text>
  </g>
</svg>
