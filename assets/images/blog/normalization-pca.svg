<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Normalization and PCA</title>
  <desc id="desc">Batch and layer normalization next to a PCA projection from two dimensions to one principal component.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="52" y="48" width="856" height="324" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="92" y="92" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Normalization + PCA</text>
  <text x="92" y="126" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Normalize activations for stable training; project data onto principal directions.</text>
  <g transform="translate(105 172)">
    <rect width="245" height="132" rx="14" fill="#eef6ff" stroke="#8fb7df"/>
    <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Batch Norm</text>
    <rect x="26" y="58" width="42" height="42" fill="#bfdbfe"/>
    <rect x="78" y="58" width="42" height="42" fill="#bfdbfe"/>
    <rect x="130" y="58" width="42" height="42" fill="#bfdbfe"/>
    <rect x="182" y="58" width="42" height="42" fill="#bfdbfe"/>
    <line x1="47" y1="50" x2="47" y2="110" stroke="#2563eb" stroke-width="4"/>
    <line x1="99" y1="50" x2="99" y2="110" stroke="#2563eb" stroke-width="4"/>
    <text x="24" y="120" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">feature-wise across batch</text>
  </g>
  <g transform="translate(390 172)">
    <rect width="245" height="132" rx="14" fill="#f0fdf4" stroke="#8bcaa1"/>
    <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Layer Norm</text>
    <rect x="34" y="58" width="40" height="42" fill="#bbf7d0"/>
    <rect x="82" y="58" width="40" height="42" fill="#bbf7d0"/>
    <rect x="130" y="58" width="40" height="42" fill="#bbf7d0"/>
    <rect x="178" y="58" width="40" height="42" fill="#bbf7d0"/>
    <line x1="28" y1="79" x2="224" y2="79" stroke="#15803d" stroke-width="4"/>
    <text x="24" y="120" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">hidden-wise per sample</text>
  </g>
  <g transform="translate(690 160)">
    <rect width="160" height="156" rx="14" fill="#fff7ed" stroke="#f0b37e"/>
    <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">PCA</text>
    <line x1="28" y1="120" x2="136" y2="52" stroke="#f97316" stroke-width="4"/>
    <g fill="#fb923c">
      <circle cx="48" cy="105" r="5"/>
      <circle cx="62" cy="92" r="5"/>
      <circle cx="78" cy="88" r="5"/>
      <circle cx="92" cy="74" r="5"/>
      <circle cx="110" cy="66" r="5"/>
      <circle cx="124" cy="55" r="5"/>
    </g>
    <text x="24" y="140" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">max variance axis</text>
  </g>
</svg>
